server {
    listen 80;

    # Security headers
    add_header X-Content-Type-Options   nosniff        always;
    add_header X-Frame-Options          DENY           always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;

    # Geographic reference data is large, even after removing provider metadata.
    # Compress these private responses without introducing a shared response cache:
    # campus GeoJSON, relief height grids and the campus scan (glTF and its buffers).
    location ~ ^/api/private/maps/(indoor/(geojson|plans|basemap|relief|relief/[0-9]+/[0-9]+/[0-9]+\.bin)|3d-tiles/file/[^/]+\.(gltf|bin))$ {
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/json application/geo+json application/octet-stream model/gltf+json;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
